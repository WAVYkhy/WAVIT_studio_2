<!DOCTYPE html>
<html lang="ko" class="no-promo">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B3RKCSSGB4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-B3RKCSSGB4');
  </script>
  <script>
    // Embed dedicated mode: force no-promo
    document.documentElement.classList.add('no-promo');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WAVIT_studio Portfolio Archive. PV, MV, Live2D & Graphic Design Showcase.">
  <title>WAVIT_studio — Portfolio Embed</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme_sharp_desktop.css?v=1.2.1">

  <style>
    /* Embed Dedicated Layout */
    :root {
      --embed-bg: var(--nordic-surface);
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--nordic-surface) !important;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .embed-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 16px 36px;
      box-sizing: border-box;
    }

    /* Minimal Category Tab Header */
    .embed-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--nordic-border);
    }

    .embed-wrapper .portfolio-tab-nav {
      margin-bottom: 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Gallery Spacing inside Embed */
    .embed-wrapper .gallery-container {
      gap: 28px;
    }

    @media (max-width: 768px) {
      .embed-wrapper {
        padding: 8px 12px 24px;
      }
      .embed-header {
        margin-bottom: 16px;
        padding-bottom: 10px;
      }
      .portfolio-tab-nav {
        width: 100%;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
      }
    }
  </style>
</head>

<body>

  <div class="embed-wrapper">
    <!-- Embed Category Filter Header -->
    <header class="embed-header">
      <nav class="portfolio-tab-nav" aria-label="Portfolio Category Navigation">
        <button type="button" class="portfolio-tab-btn active" data-tab="pv">
          <span>PV</span>
        </button>
        <button type="button" class="portfolio-tab-btn" data-tab="live2d">
          <span>LIVE2D</span>
        </button>
        <button type="button" class="portfolio-tab-btn" data-tab="thumb">
          <span>THUMBNAIL</span>
        </button>
      </nav>
    </header>

    <!-- Consolidated Portfolio Galleries -->
    <main>
      <div class="portfolio-tab-content active" id="tab-content-pv">
        <div class="gallery-container" id="pvGrid"></div>
      </div>
      <div class="portfolio-tab-content hidden" id="tab-content-live2d">
        <div class="gallery-container" id="live2dGrid"></div>
      </div>
      <div class="portfolio-tab-content hidden" id="tab-content-thumb">
        <div class="gallery-container" id="thumbGrid"></div>
      </div>
    </main>
  </div>

  <!-- Lightbox Modal -->
  <div class="sharp-modal" id="sharpModal" aria-hidden="true">
    <div class="sharp-modal-container">
      <div class="sharp-modal-header">
        <span id="modalTitle" data-i18n="system.mediaViewer">MEDIA VIEWER</span>
        <button type="button" class="sharp-modal-close" id="modalCloseBtn" aria-label="Close modal">✕</button>
      </div>
      <div class="sharp-modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="i18n.js?v=1.4.0"></script>
  <script src="data.js?v=1.7.0"></script>
  <script src="embed_portfolio.js?v=1.0.0"></script>
</body>

</html>
