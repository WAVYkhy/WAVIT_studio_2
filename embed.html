<!DOCTYPE html>
<html lang="ko" class="no-promo">

<head>
  <!-- GitHub Pages to Custom Domain Instant Redirect -->
  <link rel="canonical" href="https://wavit-studio.com/embed.html">
  <script>
    if (window.location.hostname === 'wavykhy.github.io') {
      var cleanPath = window.location.pathname.replace(/^\/WAVIT_studio_2/, '') || '/';
      window.location.replace('https://wavit-studio.com' + cleanPath + window.location.search + window.location.hash);
    }
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B3RKCSSGB4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-B3RKCSSGB4');
  </script>
  <script>
    // Embed dedicated mode: force no-promo
    document.documentElement.classList.add('no-promo');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="WAVIT_studio Portfolio Archive. PV, MV, Live2D & Graphic Design Showcase.">
  <title>WAVIT_studio — Portfolio Embed</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme_sharp_desktop.css?v=1.2.1">

  <style>
    /* Embed Dedicated Layout Adjustments */
    :root {
      --embed-bg: var(--nordic-surface);
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--nordic-surface) !important;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .embed-wrapper {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px 20px 40px;
      box-sizing: border-box;
    }

    .embed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--nordic-border);
    }

    .embed-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .embed-brand-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .embed-brand-badge span {
      color: var(--text-muted);
    }

    /* Embedded Tab Navigation */
    .embed-wrapper .portfolio-tab-nav {
      margin-bottom: 0;
    }

    /* Embedded Language Switcher */

    /* Gallery Spacing inside Embed */
    .embed-wrapper .gallery-container {
      gap: 28px;
    }

    @media (max-width: 768px) {
      .embed-wrapper {
        padding: 12px 14px 30px;
      }
      .embed-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .embed-header-left {
        width: 100%;
        justify-content: space-between;
      }
      .portfolio-tab-nav {
        width: 100%;
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

  <div class="embed-wrapper">
    <!-- Embed Top Bar -->
    <header class="embed-header">
      <div class="embed-header-left">
        <div class="embed-brand-badge">
          PORTFOLIO
        </div>

        <!-- Category Tab Buttons -->
        <nav class="portfolio-tab-nav" aria-label="Portfolio Category Navigation">
          <button type="button" class="portfolio-tab-btn active" data-tab="pv">
            <span data-i18n="portfolio.tabPv">PV</span>
          </button>
          <button type="button" class="portfolio-tab-btn" data-tab="live2d">
            <span data-i18n="portfolio.tabLive2d">LIVE2D</span>
          </button>
          <button type="button" class="portfolio-tab-btn" data-tab="thumb">
            <span data-i18n="portfolio.tabThumb">THUMBNAIL</span>
          </button>
        </nav>
      </div>

    </header>

    <!-- Consolidated Portfolio Galleries -->
    <main>
      <div class="portfolio-tab-content active" id="tab-content-pv">
        <div class="gallery-container" id="pvGrid"></div>
      </div>
      <div class="portfolio-tab-content hidden" id="tab-content-live2d">
        <div class="gallery-container" id="live2dGrid"></div>
      </div>
      <div class="portfolio-tab-content hidden" id="tab-content-thumb">
        <div class="gallery-container" id="thumbGrid"></div>
      </div>
    </main>
  </div>

  <!-- Lightbox Modal -->
  <div class="sharp-modal" id="sharpModal" aria-hidden="true">
    <div class="sharp-modal-container">
      <div class="sharp-modal-header">
        <span id="modalTitle" data-i18n="system.mediaViewer">MEDIA VIEWER</span>
        <button type="button" class="sharp-modal-close" id="modalCloseBtn" aria-label="Close modal">✕</button>
      </div>
      <div class="sharp-modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="i18n.js?v=1.5.0"></script>
  <script src="data.js?v=1.7.0"></script>
  <script src="embed_portfolio.js?v=1.0.0"></script>
</body>

</html>
