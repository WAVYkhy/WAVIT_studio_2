  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Single unified theme: theme_sharp_desktop.html
      const selectedTheme = 'theme_sharp_desktop.html';
      const urlParams = new URLSearchParams(window.location.search);
      
      // GA4 event tracking
      if (typeof window.gtag === 'function') {
        window.gtag('event', 'theme_assignment', {
          'assigned_theme': selectedTheme,
          'transport': 'beacon'
        });
      }

      urlParams.delete('exclude');
      const searchStr = urlParams.toString() ? ('?' + urlParams.toString()) : '';

      // Redirect replacing history
      window.location.replace(selectedTheme + searchStr);
    });
  </script>
